type Folder {
  id: ID!
  name: String!
  createdAt: String!
  bookmarks: [Bookmark!]!
}

type Bookmark {
  id: ID!
  title: String!
  url: String!
  tags: [String!]!
  folderId: ID!
  createdAt: String!
  folder: Folder!
}

type Query {
  folders: [Folder!]!
  folder(id: ID!): Folder
  bookmarks: [Bookmark!]!
  bookmark(id: ID!): Bookmark
}

type Mutation {
  createFolder(name: String!): Folder!
  updateFolder(id: ID!, name: String!): Folder!
  deleteFolder(id: ID!): Boolean!

  createBookmark(
    title: String!
    url: String!
    tags: [String!]
    folderId: ID!
  ): Bookmark!

  updateBookmark(
    id: ID!
    title: String
    url: String
    tags: [String!]
    folderId: ID
  ): Bookmark!

  deleteBookmark(id: ID!): Boolean!
}