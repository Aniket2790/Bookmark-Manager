services:
  postgres:
    image: postgres:17
    container_name: bookmark-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookmark_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmark_manager"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data: